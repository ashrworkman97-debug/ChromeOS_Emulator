name: Tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --no-deps .
      - run: python -m compileall -q src tests
      - run: python -m unittest discover -s tests -v

  bochs-rom-package-smoke:
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - uses: actions/checkout@v4
      - name: Install Debian 13 packages used by Crostini
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3 bochs bochs-sdl bochsbios vgabios xvfb xauth
      - name: Verify real Debian package ROMs and generated Bochs configuration
        run: |
          PYTHONPATH=src python3 - <<'PY'
          import tempfile
          from pathlib import Path
          from chromeos_vm.manager import VMManager

          with tempfile.TemporaryDirectory() as temp:
              manager = VMManager(Path(temp) / "vms")
              system_bios = manager._find_bios("BIOS-bochs-latest")
              vga_bios = manager._find_bios("VGABIOS-lgpl-latest")
              assert system_bios == Path("/usr/share/bochs/BIOS-bochs-latest").resolve(), system_bios
              assert vga_bios == Path("/usr/share/vgabios/vgabios.bin").resolve(), vga_bios
              vm = manager.create("rom-smoke", memory_mib=128, disk_gib=1)
              config = manager.render_bochsrc(vm)
              assert f'romimage: file="{system_bios}"' in config
              assert f'vgaromimage: file="{vga_bios}"' in config
              print(f"System BIOS: {system_bios}")
              print(f"VGA BIOS: {vga_bios}")
          PY
      - name: Parse and run a short headless Bochs smoke configuration
        run: |
          PYTHONPATH=src python3 - <<'PY'
          import subprocess
          import tempfile
          from pathlib import Path
          from chromeos_vm.manager import VMManager

          with tempfile.TemporaryDirectory() as temp:
              manager = VMManager(Path(temp) / "vms")
              vm = manager.create("bochs-parser-smoke", memory_mib=128, disk_gib=1)
              config = manager.render_bochsrc(vm)
              # The CI container has no physical audio device; disable the PC speaker.
              config += "\nspeaker: enabled=0\n"
              config_path = manager.vm_path(vm.name) / "bochsrc.ci"
              config_path.write_text(config, encoding="utf-8")
              result = subprocess.run(
                  ["xvfb-run", "-a", "env", "SDL_VIDEODRIVER=x11",
                   "bochs", "-benchmark", "1", "-q", "-f", str(config_path)],
                  capture_output=True, text=True, timeout=45, check=False,
              )
              log_path = manager.vm_path(vm.name) / "logs/bochs.log"
              log_text = log_path.read_text(encoding="utf-8", errors="replace") if log_path.is_file() else ""
              required_markers = ("VGABios", "ata0-0:", "cpu loop quit")
              missing = [marker for marker in required_markers if marker not in log_text]
              if missing or ">>PANIC<<" in log_text:
                  raise SystemExit(
                      "Bochs config/parser smoke failed; missing log markers: "
                      + repr(missing) + "\\n" + result.stdout[-3000:]
                      + result.stderr[-3000:] + log_text[-8000:]
                  )
              print(
                  "Bochs parsed the generated config, initialized BIOS/VGA/IDE, "
                  f"and completed the bounded benchmark (exit status {result.returncode})."
              )
          PY

  native-gui-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Tk and virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk xvfb
      - name: Instantiate and exercise the native Tk manager
        run: |
          PYTHONPATH=src xvfb-run -a /usr/bin/python3 - <<'PY'
          import tempfile
          import tkinter as tk
          from pathlib import Path
          from chromeos_vm.gui import ChromeOSVMStudio
          from chromeos_vm.manager import VMManager

          with tempfile.TemporaryDirectory() as temp:
              root = tk.Tk()
              manager = VMManager(Path(temp) / "vms")
              app = ChromeOSVMStudio(root, manager)
              root.update_idletasks()
              assert root.title() == "ChromeOS VM Studio"
              assert app.table.winfo_exists()
              manager.create("dos-test", memory_mib=128, disk_gib=1)
              app.refresh()
              assert app.table.exists("dos-test")
              assert app.table.set("dos-test", "state") == "Stopped"
              assert app.table.tag_has("stopped", "dos-test")
              root.destroy()
          print("Native Tk GUI smoke test passed.")
          PY

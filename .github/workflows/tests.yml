name: Tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --no-deps .
      - run: python -m compileall -q src tests
      - run: python -m unittest discover -s tests -v

  bochs-rom-package-smoke:
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - uses: actions/checkout@v4
      - name: Install Debian 13 packages used by Crostini
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3 bochs bochs-sdl bochsbios vgabios xvfb xauth
      - name: Verify real Debian package ROMs and generated Bochs configuration
        run: |
          PYTHONPATH=src python3 - <<'PY'
          import tempfile
          from pathlib import Path
          from chromeos_vm.manager import VMManager

          with tempfile.TemporaryDirectory() as temp:
              manager = VMManager(Path(temp) / "vms")
              system_bios = manager._find_bios("BIOS-bochs-latest")
              vga_bios = manager._find_bios("VGABIOS-lgpl-latest")
              assert system_bios == Path("/usr/share/bochs/BIOS-bochs-latest").resolve(), system_bios
              assert vga_bios == Path("/usr/share/vgabios/vgabios.bin").resolve(), vga_bios
              vm = manager.create("rom-smoke", memory_mib=128, disk_gib=1)
              config = manager.render_bochsrc(vm)
              assert f'romimage: file="{system_bios}"' in config
              assert f'vgaromimage: file="{vga_bios}"' in config
              print(f"System BIOS: {system_bios}")
              print(f"VGA BIOS: {vga_bios}")
          PY
      - name: Parse and run a short headless Bochs smoke configuration
        run: |
          PYTHONPATH=src python3 - <<'PY'
          import subprocess
          import tempfile
          from pathlib import Path
          from chromeos_vm.manager import VMManager

          with tempfile.TemporaryDirectory() as temp:
              manager = VMManager(Path(temp) / "vms")
              vm = manager.create("bochs-parser-smoke", memory_mib=128, disk_gib=1)
              config = manager.render_bochsrc(vm)
              # The CI container has no physical audio device; disable the PC speaker.
              config += "\nspeaker: enabled=0\n"
              config_path = manager.vm_path(vm.name) / "bochsrc.ci"
              config_path.write_text(config, encoding="utf-8")
              result = subprocess.run(
                  ["xvfb-run", "-a", "env", "SDL_VIDEODRIVER=x11",
                   "bochs", "-benchmark", "1", "-q", "-f", str(config_path)],
                  capture_output=True, text=True, timeout=45, check=False,
              )
              log_path = manager.vm_path(vm.name) / "logs/bochs.log"
              log_text = log_path.read_text(encoding="utf-8", errors="replace") if log_path.is_file() else ""
              required_markers = ("VGABios", "ata0-0:", "cpu loop quit")
              missing = [marker for marker in required_markers if marker not in log_text]
              if missing or ">>PANIC<<" in log_text:
                  raise SystemExit(
                      "Bochs config/parser smoke failed; missing log markers: "
                      + repr(missing) + "\n" + result.stdout[-3000:]
                      + result.stderr[-3000:] + log_text[-8000:]
                  )
              print(
                  "Bochs parsed the generated config, initialized BIOS/VGA/IDE, "
                  f"and completed the bounded benchmark (exit status {result.returncode})."
              )
          PY


      - name: Parse and initialize floppy A and B images with real Bochs
        run: |
          PYTHONPATH=src python3 - <<'PY'
          import subprocess
          import tempfile
          from pathlib import Path
          from chromeos_vm.manager import VMManager

          with tempfile.TemporaryDirectory() as temp:
              manager = VMManager(Path(temp) / "vms")
              floppy_a = Path(temp) / "boot-1440k.img"
              floppy_b = Path(temp) / "data-720k.img"
              floppy_a.write_bytes(bytes(1_440 * 1024))
              floppy_b.write_bytes(bytes(720 * 1024))
              vm = manager.create("floppy-parser-smoke", memory_mib=128, disk_gib=1)
              vm = manager.set_floppy_a(vm.name, floppy_a)
              vm = manager.set_floppy_b(vm.name, floppy_b)
              config = manager.render_bochsrc(vm)
              assert 'floppya: image="' + str(floppy_a.resolve()) + '", status=inserted, write_protected=1' in config
              assert 'floppyb: image="' + str(floppy_b.resolve()) + '", status=inserted, write_protected=1' in config
              assert "boot: floppy, disk" in config
              config += "\nspeaker: enabled=0\n"
              config_path = manager.vm_path(vm.name) / "bochsrc.floppy-ci"
              config_path.write_text(config, encoding="utf-8")
              result = subprocess.run(
                  ["xvfb-run", "-a", "env", "SDL_VIDEODRIVER=x11",
                   "bochs", "-benchmark", "1", "-q", "-f", str(config_path)],
                  capture_output=True, text=True, timeout=45, check=False,
              )
              log_path = manager.vm_path(vm.name) / "logs/bochs.log"
              log_text = log_path.read_text(encoding="utf-8", errors="replace") if log_path.is_file() else ""
              required_markers = ("VGABios", "ata0-0:", "cpu loop quit")
              missing = [marker for marker in required_markers if marker not in log_text]
              if missing or ">>PANIC<<" in log_text:
                  raise SystemExit(
                      "Bochs floppy configuration smoke failed; missing markers: "
                      + repr(missing) + "\\n" + result.stdout[-3000:]
                      + result.stderr[-3000:] + log_text[-8000:]
                  )
              print(
                  "Bochs accepted floppy A and B images, initialized BIOS/VGA/IDE, "
                  f"and completed its bounded benchmark (exit status {result.returncode})."
              )
          PY

      - name: Parse and initialize each exposed CPU model with real Bochs
        run: |
          PYTHONPATH=src python3 - <<'PY'
          import subprocess
          import tempfile
          from pathlib import Path
          from chromeos_vm.manager import CPU_MODEL_LABELS, VMManager

          with tempfile.TemporaryDirectory() as temp:
              manager = VMManager(Path(temp) / "vms")
              vm = manager.create("cpu-model-smoke", memory_mib=128, disk_gib=1)
              base = manager.render_bochsrc(vm)
              default_cpu = f"cpu: count=1, ips={vm.cpu_ips}, reset_on_triple_fault=1"
              if default_cpu not in base:
                  raise SystemExit("Could not find generated CPU directive to parameterize.")
              for model in (name for name in CPU_MODEL_LABELS if name != "default"):
                  config = base.replace(
                      default_cpu,
                      f"cpu: model={model}, count=1, ips={vm.cpu_ips}, reset_on_triple_fault=1",
                      1,
                  ) + "\nspeaker: enabled=0\n"
                  config_path = manager.vm_path(vm.name) / f"bochsrc.cpu-{model}"
                  config_path.write_text(config, encoding="utf-8")
                  log_path = manager.vm_path(vm.name) / "logs/bochs.log"
                  log_path.unlink(missing_ok=True)
                  result = subprocess.run(
                      ["xvfb-run", "-a", "env", "SDL_VIDEODRIVER=x11",
                       "bochs", "-benchmark", "1", "-q", "-f", str(config_path)],
                      capture_output=True, text=True, timeout=45, check=False,
                  )
                  log_text = log_path.read_text(encoding="utf-8", errors="replace") if log_path.is_file() else ""
                  if "cpu loop quit" not in log_text or ">>PANIC<<" in log_text:
                      raise SystemExit(
                          f"Bochs rejected CPU model {model} (exit {result.returncode}):\n"
                          + result.stdout[-2000:] + result.stderr[-2000:] + log_text[-6000:]
                      )
                  print(f"Bochs CPU model initialized: {model}")
          PY

      - name: Parse and initialize each supported PCI chipset with real Bochs
        run: |
          PYTHONPATH=src python3 - <<'PY'
          import subprocess
          import tempfile
          from pathlib import Path
          from chromeos_vm.manager import CHIPSET_LABELS, VMManager

          with tempfile.TemporaryDirectory() as temp:
              manager = VMManager(Path(temp) / "vms")
              for chipset in CHIPSET_LABELS:
                  vm = manager.create(
                      "pci-" + chipset, memory_mib=128, disk_gib=1, chipset=chipset
                  )
                  config = manager.render_bochsrc(vm) + "\nspeaker: enabled=0\n"
                  assert f"pci: enabled=1, chipset={chipset}" in config
                  config_path = manager.vm_path(vm.name) / "bochsrc.pci-ci"
                  config_path.write_text(config, encoding="utf-8")
                  log_path = manager.vm_path(vm.name) / "logs/bochs.log"
                  result = subprocess.run(
                      ["xvfb-run", "-a", "env", "SDL_VIDEODRIVER=x11",
                       "bochs", "-benchmark", "1", "-q", "-f", str(config_path)],
                      capture_output=True, text=True, timeout=45, check=False,
                  )
                  log_text = log_path.read_text(encoding="utf-8", errors="replace") if log_path.is_file() else ""
                  required_markers = ("VGABios", "ata0-0:", "cpu loop quit")
                  missing = [marker for marker in required_markers if marker not in log_text]
                  if missing or ">>PANIC<<" in log_text:
                      raise SystemExit(
                          f"Bochs rejected PCI chipset {chipset}; missing markers: {missing}\n"
                          + result.stdout[-2500:] + result.stderr[-2500:] + log_text[-6000:]
                      )
                  print(f"Bochs PCI chipset initialized: {chipset} (exit {result.returncode})")
          PY

  native-gui-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Tk and virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk xvfb
      - name: Instantiate and exercise the native Tk manager
        run: |
          PYTHONPATH=src xvfb-run -a /usr/bin/python3 - <<'PY'
          import tempfile
          import tkinter as tk
          from tkinter import ttk
          from pathlib import Path
          from chromeos_vm.gui import ChromeOSVMStudio
          from chromeos_vm.manager import CHIPSET_LABELS, VMManager

          def descendants(widget):
              for child in widget.winfo_children():
                  yield child
                  yield from descendants(child)

          with tempfile.TemporaryDirectory() as temp:
              root = tk.Tk()
              manager = VMManager(Path(temp) / "vms")
              app = ChromeOSVMStudio(root, manager)
              root.update_idletasks()
              assert root.title() == "ChromeOS VM Studio"
              assert app.table.winfo_exists()

              # Exercise the actual create dialog and confirm chipset choices
              # are presented by native Tk widgets, not just manager APIs.
              app.new_vm()
              root.update()
              create_dialog = next(w for w in root.winfo_children() if isinstance(w, tk.Toplevel))
              create_combos = [w for w in descendants(create_dialog) if isinstance(w, ttk.Combobox)]
              assert any(set(CHIPSET_LABELS.values()).issubset(set(w.cget("values"))) for w in create_combos)
              create_dialog.destroy()

              manager.create("dos-test", memory_mib=128, disk_gib=1)
              app.refresh()
              assert app.table.exists("dos-test")
              assert app.table.set("dos-test", "state") == "Stopped"
              assert app.table.tag_has("stopped", "dos-test")
              app.table.selection_set("dos-test")

              # Exercise the edit dialog too, so profile changes remain reachable.
              app.edit_vm()
              root.update()
              edit_dialog = next(w for w in root.winfo_children() if isinstance(w, tk.Toplevel))
              edit_combos = [w for w in descendants(edit_dialog) if isinstance(w, ttk.Combobox)]
              assert any(set(CHIPSET_LABELS.values()).issubset(set(w.cget("values"))) for w in edit_combos)
              edit_dialog.destroy()
              root.destroy()
          print("Native Tk GUI and PCI chipset dialog smoke test passed.")
          PY

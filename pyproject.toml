[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chromeos-vm-studio"
version = "0.3.2"
description = "A native Crostini desktop VM manager powered by Bochs (no QEMU)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.scripts]
chromeos-vm = "chromeos_vm.cli:main"
chromeos-vm-studio = "chromeos_vm.gui:main"
chromeos-vm-update = "chromeos_vm.updater:main"

[tool.setuptools.packages.find]
where = ["src"]

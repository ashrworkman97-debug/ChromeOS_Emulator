[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chromeos-vm-studio"
version = "0.1.0"
description = "A non-QEMU ChromeOS virtual machine manager powered by crosvm"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.scripts]
chromeos-vm = "chromeos_vm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
